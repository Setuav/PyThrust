site_name: PyThrust
site_description: Electric propulsion system co-design, analysis, and optimization framework for UAVs
site_author: Hüseyin Karakaya
repo_url: https://github.com/Setuav/PyThrust
repo_name: Setuav/PyThrust
edit_uri: edit/main/docs/

theme:
  name: material
  logo: images/setuav_logo.png
  favicon: images/setuav_logo.png
  font:
    text: Fira Sans
    code: Fira Code
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - redirects:
      redirect_maps:
        theory.md: reference/propulsion_solver.md
        api_reference.md: reference/propulsion_solver.md
        data_files.md: reference/propellers.md
        battery_model.md: reference/battery.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-mml-chtml.js

nav:
  - User Guide:
      - index.md
      - Getting Started: getting_started.md
      - Solving an Operating Point: usage.md
      - Examples: examples.md
  - Reference:
      - Propellers:
          - reference/propellers.md
          - Tabulated Propeller: reference/table_propeller.md
          - Blade-Element Propeller: reference/blade_element_propeller.md
      - Motor: reference/motor.md
      - Battery: reference/battery.md
      - Propulsion Solver: reference/propulsion_solver.md
      - OpenMDAO: reference/openmdao.md
  - Developer Guide:
      - Development & Testing: development.md
